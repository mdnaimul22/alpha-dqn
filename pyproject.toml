[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-dqn"
version = "1.0.0"
description = "Production-grade Double-DQN framework featuring an evolved algorithmic triad (Curiosity, Adaptive Loss, Directed Exploration)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.20.0",
    "bcrypt>=4.0.0",
    "fastapi>=0.110.0",
    "numpy>=1.26.0",
    "openevolve>=0.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "tenacity>=8.2.0",
    "torch>=2.2.0",
    "uvicorn[standard]>=0.28.0",
    "watchfiles>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
