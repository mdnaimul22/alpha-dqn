[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-dqn"
version = "1.0.0"
description = "Auto-generated project specification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.135.0",
    "numpy>=2.4.0",
    "openevolve>=0.2.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.12.0",
    "sqlalchemy>=2.0.0",
    "tenacity>=9.1.0",
    "torch>=2.12.0",
    "uvicorn>=0.42.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
